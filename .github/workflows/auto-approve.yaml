name: Approve bot PR

on:
  pull_request:
    types:
      - opened
    paths:
      - flagd/flagd-config.yaml
      - image-provider/src/src/getProductImage.js
      - image-provider/terraform/modules/image-processing/locals.tf

jobs:
  approve:
    name: Auto-approve
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'demoability-robot'
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Approve PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require("./.github/scripts/approve-pr.js")({ github, context, core })
      - name: Merge PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require("./.github/scripts/merge-pr.js")({ github, context, core })
